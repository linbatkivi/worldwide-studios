# Fly.io. Sat op til at koste så lidt som muligt: én lille maskine der slukker, når ingen bruger den (du betaler kun, mens den kører),
# 1 GB disk til databasen (den mindste Fly tilbyder), ingen dedikeret IPv4-adresse, ingen helbredstjek der holder den vågen.
# Brug tools/deploy-api.sh. Appnavnet skal være unikt hos Fly.
app = 'worldwide-id'
primary_region = 'arn'

[build]

[env]
  PORT = '8080'
  DB_PATH = '/data/worldwide.db'
  IP_HEADER = 'fly-client-ip'

[mounts]
  source = 'worldwide_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
