# Bygger launcheren til Windows, macOS og Linux og lægger filerne på en Release.
# Hjemmesidens download-knapper peger på releases/latest/download/<fil>, så filnavnene er faste.
#
# Ny udgave:
#   1. ret "version" i launcher/package.json (fx 1.0.1)
#   2. git commit og push
#   3. git tag launcher-v1.0.1 && git push origin launcher-v1.0.1
name: Launcher
on:
  push:
    tags: ['launcher-v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: mac }
          - { os: windows-latest, target: win }
          - { os: ubuntu-latest, target: linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tjek at tagget passer med versionen
        shell: bash
        run: |
          V=$(node -p "require('./launcher/package.json').version")
          if [ "launcher-v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tagget $GITHUB_REF_NAME passer ikke med launcher/package.json ($V)"; exit 1
          fi

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: launcher
      - run: npm test
        working-directory: launcher

      - name: Byg
        working-directory: launcher
        run: npm run dist:${{ matrix.target }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: softprops/action-gh-release@v2
        with:
          name: Launcher ${{ github.ref_name }}
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            launcher/dist/Worldwide-*
            launcher/dist/latest*.yml
